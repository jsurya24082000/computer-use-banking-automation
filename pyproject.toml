[build-system]
requires = ["setuptools==80.4.0"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-use-banking-automation"
version = "1.0.0"
description = "LLM-discovered, deterministically replayed banking UI capabilities"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "jinja2==3.1.6",
  "python-multipart==0.0.20", "pydantic==2.11.4",
  "playwright==1.52.0", "httpx==0.28.1"
]

[project.optional-dependencies]
test = ["pytest==8.3.5", "pytest-asyncio==0.26.0"]

[project.scripts]
bank-auto = "automation.cli:main"

[tool.setuptools.packages.find]
include = ["banking_app*", "automation*"]

[tool.setuptools.package-data]
banking_app = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["browser: real Chromium integration test"]
