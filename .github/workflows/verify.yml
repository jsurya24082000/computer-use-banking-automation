name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m playwright install chromium
      - name: Run Ruff
        run: python -m ruff check automation banking_app tests tools --select F
      - name: Run tests
        run: python -m pytest -q --basetemp="${{ runner.temp }}/banking-pytest"
      - name: Upload sanitized failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-evidence-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/banking-pytest/**/events.jsonl
            ${{ runner.temp }}/banking-pytest/**/failure-snapshot.json
          if-no-files-found: warn
          retention-days: 7
